# Launchpad pre-commit hooks
# 目标: 提交前自动执行基础检查（项目已无 C++ 源码，零 shell 约束由
#       LaunchPlannerTests 等单测覆盖，不再需要 pygrep 钩子）
# 安装: pip install pre-commit && pre-commit install

repos:
  # --- 基础文件检查 ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      # 与 .gitattributes / .editorconfig 统一为 CRLF（Windows 项目）
      - id: mixed-line-ending
        args: [--fix=crlf]
