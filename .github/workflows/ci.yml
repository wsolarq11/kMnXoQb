# CI — WinUI 3 + C# (.NET 10, launchpad/)
#
# Windows 原生应用：单平台构建 + 测试。Rust/C++ 时代的多平台矩阵已随
# 2026-07-31 WinUI 3 迁移移除。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build-and-test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launchpad
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/launchpad/launchpad.csproj

      - name: Build (Release)
        run: dotnet build src/launchpad/launchpad.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/launchpad.Core.Tests/ --configuration Release
